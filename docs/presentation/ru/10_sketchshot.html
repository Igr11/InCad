<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap"><style>
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden}

</style></head><body><section id="sketchshot" data-transition="fade" style="background:#16202C;color:#F3F2EE;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:32px">
